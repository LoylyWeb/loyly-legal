<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loyly · Legal</title>
<style>
:root { --bg:#fff8f5; --surface:#ffffff; --ink:#2a1a12; --muted:#6b5247; --accent:#ab3500; --ember:#ff6b35; --line:#f1dcd2; }
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
header { background:linear-gradient(135deg, var(--accent), var(--ember)); color:#fff; padding:28px 20px 24px; }
header .brand { font-weight:800; letter-spacing:.14em; font-size:13px; opacity:.9; text-transform:uppercase; }
header nav { margin-top:10px; display:flex; gap:16px; font-size:14px; }
header nav a { color:#fff; opacity:.85; text-decoration:none; }
header nav a[aria-current="page"] { opacity:1; font-weight:700; text-decoration:underline; text-underline-offset:4px; }
main { max-width:760px; margin:0 auto; padding:24px 20px 56px; }
h1 { font-size:28px; line-height:1.2; margin:4px 0 6px; letter-spacing:-.01em; }
h2 { font-size:20px; margin:32px 0 8px; color:var(--accent); }
h3 { font-size:17px; margin:22px 0 6px; }
p, li { color:var(--ink); }
a { color:var(--accent); }
strong { font-weight:700; }
ul { padding-left:22px; }
table { width:100%; border-collapse:collapse; margin:12px 0; font-size:14px; background:var(--surface); border-radius:12px; overflow:hidden; }
th, td { text-align:left; vertical-align:top; padding:10px 12px; border-bottom:1px solid var(--line); }
th { background:#ffece4; color:var(--accent); font-weight:700; }
code { background:#ffece4; padding:1px 6px; border-radius:6px; font-size:.92em; }
footer { max-width:760px; margin:0 auto; padding:0 20px 40px; color:var(--muted); font-size:13px; }
@media (min-width:720px) { header { padding:40px 32px 32px; } }
</style>
</head>
<body>
<header><div class="brand">Loyly</div></header>
<main>
<h1>Loyly legal</h1>
<ul>
<li><a href="loyly/terms/">Terms of Use</a></li>
<li><a href="loyly/privacy/">Privacy Policy</a></li>
</ul>
</main>
</body>
</html>
